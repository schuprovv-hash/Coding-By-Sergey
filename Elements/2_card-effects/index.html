<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Карточка</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="card">
            <div class="card-content">
                <h1>Тариф ПРО</h1>
                <ul>
                    <li>Быстрая поддержка</li>
                    <li>Открытие заблокированных функций</li>
                    <li>Вип-чат с людьми</li>
                    <li>Быстрое оформление заявок</li>
                </ul>
                <div class="shop">
                    <div class="prise">
                        <span>10 $ / мес.</span>
                        <button>Оплатить</button>
                    </div>
                    <div class="img">
                        <img src="static/Visa.png" alt="">
                        <img src="static/MNP.png" alt="">
                        <img src="static/Mastercard.png" alt="">
                    </div>
                </div>
                <p>Нажимая на кнопку, вы принимаете условия <i>Оферты</i></p>
            </div>
        </div>
    </body>
</html>
